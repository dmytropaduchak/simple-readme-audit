name: Simple Readme Audit
description: Warn when code or version files change but README is not updated.
author: Dmytro Paduchak
branding:
  icon: book
  color: blue
inputs:
  github-token:
    description: Token to read PR data and post sticky comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail when findings match."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
